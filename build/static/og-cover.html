<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400;1,500&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:#F7F3EC;font-family:'Poppins',sans-serif;color:#2A1820}
  .wrap{position:relative;width:1200px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:0 90px}
  .glow{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(52% 46% at 50% 14%, rgba(243,228,232,0.95) 0%, rgba(243,228,232,0) 100%),
    radial-gradient(30% 34% at 84% 74%, rgba(200,160,99,0.18) 0%, rgba(200,160,99,0) 100%),
    radial-gradient(26% 32% at 12% 64%, rgba(201,125,144,0.16) 0%, rgba(201,125,144,0) 100%)}
  .c{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px}
  img{height:104px;width:auto;display:block}
  .name{font-family:'Lora',serif;font-weight:600;font-size:58px;letter-spacing:0.01em;color:#7B2F4D;line-height:1}
  .rule{width:96px;height:1px;background:#C8A063}
  .slogan{font-family:'Lora',serif;font-style:italic;font-weight:400;font-size:31px;line-height:1.35;color:#5E1F39;max-width:820px}
  .eyebrow{font-size:15px;font-weight:500;letter-spacing:0.3em;text-transform:uppercase;color:#A0793F}
</style></head><body>
<div class="wrap"><div class="glow"></div><div class="c">
  <img src="/assets/logo-wine.png" alt="">
  <div class="name">Cinta Foundation</div>
  <div class="rule"></div>
  <div class="slogan">Karena Semua Manusia Layak Mendapatkan Cinta</div>
  <div class="eyebrow">Yayasan Cinta Negeri Persada</div>
</div></div></body></html>
